<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physio 3D Training Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p style="margin-top: 20px; color: #00f2ff; letter-spacing: 2px;">LOADING SKELETON...</p>
    </div>

    <div id="instruction-overlay">
        <h1 id="instr-title">Select an Exercise</h1>
        <h3 id="instr-step">Waiting...</h3>
        <p id="instr-desc"></p>
    </div>

    <div class="ui-panel">
        <h1>Physio Library</h1>
        <div id="exercise-list">
            <!-- Buttons generated by main.js -->
        </div>
    </div>

    <canvas id="canvas-container"></canvas>

    <button id="rest-btn" class="rest-action-btn">Go to Rest</button>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
